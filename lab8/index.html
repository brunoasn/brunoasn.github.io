<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja Online</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Loja Online</h1>
      <nav>
        <ul>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="produtos">
        <h2>Produtos</h2>

        <section id="controlos" aria-label="Filtros">
          <label for="filtro-categoria">Categoria</label>
          <select id="filtro-categoria">
            <option value="">Todas as categorias</option>
          </select>

          <label for="ordenar-preco">Ordenar</label>
          <select id="ordenar-preco">
            <option value="">Sem ordenação</option>
            <option value="crescente">Preço crescente</option>
            <option value="decrescente">Preço decrescente</option>
          </select>

          <label for="pesquisa">Pesquisar</label>
          <input id="pesquisa" type="search" placeholder="Nome do produto" />
        </section>

        <section id="lista-produtos" aria-label="Lista de produtos"></section>
      </section>

      <section id="cesto">
        <h2>Cesto</h2>
        <section id="lista-cesto" aria-label="Produtos no cesto"></section>
        <h3>Total: <span id="total">0</span> €</h3>

        <form id="form-compra">
          <label>
            <input id="estudante" type="checkbox" />
            Sou estudante DEISI
          </label>

          <label for="cupao">Cupão de desconto</label>
          <input id="cupao" type="text" />

          <button type="submit">Comprar</button>
        </form>

        <section id="resultado-compra" aria-live="polite"></section>
      </section>
    </main>

    <footer>
      <h2>Loja Online</h2>
      <p>2026, ULusófona</p>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
